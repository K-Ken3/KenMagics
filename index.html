<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KEN KARASIRA | Digital Product Engineer & Designer</title>
    
    <!-- Custom PNG Logo for Browser Tab -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Plus Jakarta Sans', 'sans-serif'],
              syne: ['Syne', 'sans-serif'],
            },
            colors: {
              primary: '#10b981', 
              secondary: '#34d399',
              dark: '#07090e',
              darker: '#040508',
              card: '#0e131f',
              cardHover: '#131929',
              accent: '#06b6d4'
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 4s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
              'marquee': 'marquee 25s linear infinite',
              'marquee-reverse': 'marquee-reverse 25s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-8px)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              'marquee-reverse': {
                '0%': { transform: 'translateX(-50%)' },
                '100%': { transform: 'translateX(0%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        background-color: #07090e;
        color: #f1f5f9;
        margin: 0;
        overflow-x: hidden;
        font-family: 'Inter', sans-serif;
      }

      /* Custom Framer-style Glass & Borders */
      .framer-glass {
        background: rgba(14, 19, 31, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .framer-glass-pill {
        background: rgba(10, 14, 23, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .framer-card {
        background: #0e131f;
        border: 1px solid rgba(255, 255, 255, 0.07);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .framer-card:hover {
        border-color: rgba(16, 185, 129, 0.35);
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 20px 0 rgba(16, 185, 129, 0.08);
        transform: translateY(-2px);
      }

      .gradient-text {
        background: linear-gradient(135deg, #10b981 0%, #34d399 50%, #06b6d4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .gradient-border {
        position: relative;
      }
      .gradient-border::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.5), rgba(255, 255, 255, 0.05), rgba(6, 182, 212, 0.3));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #07090e;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #10b981;
      }

      /* Animated Loader */
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #07090e;
        z-index: 9999;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
      }
      .loader-circle {
        width: 80px;
        height: 80px;
        border: 2px solid rgba(16, 185, 129, 0.1);
        border-top: 2px solid #10b981;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.76, 0, 0.24, 1) infinite;
      }
      .loader-text {
        margin-top: 24px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        letter-spacing: 0.25em;
        color: #10b981;
        text-transform: uppercase;
        font-size: 0.75rem;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      body.loaded #loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #error-display {
        display: none;
        position: fixed;
        inset: 0;
        background: #07090e;
        color: #ef4444;
        padding: 40px;
        font-family: monospace;
        z-index: 10000;
        overflow: auto;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.40.0",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0",
    "motion": "https://esm.sh/motion@12.4.7",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <script>
      window.markAppAsLoaded = function() {
        console.log("UI: Application signaled ready.");
        document.body.classList.add('loaded');
      };

      window.onerror = function(msg, url, line, col, error) {
        const display = document.getElementById('error-display');
        if (!display) return;
        display.style.display = 'block';
        display.innerHTML = `
          <h1 style="font-size: 24px; color: #ef4444; margin-bottom: 16px;">Application Crash</h1>
          <p><strong>Message:</strong> ${msg}</p>
          <p><strong>Source:</strong> ${url}</p>
          <pre style="margin-top: 20px; background: #0f172a; padding: 20px; border-radius: 8px; color: #94a3b8; font-size: 12px;">${error ? error.stack : 'Stack trace unavailable'}</pre>
          <button onclick="location.reload()" style="margin-top: 20px; padding: 12px 24px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Reload Application</button>
        `;
        return false;
      };
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="loader">
      <div class="loader-circle"></div>
      <div class="loader-text">KARASIRA KEN • CREATIVE STUDIO</div>
    </div>
    <div id="error-display"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
